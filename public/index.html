<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR OM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Plano: painel institucional de inteligência de compras — verde-oliva como acento,
   neutros cinza-esverdeados, títulos condensados, números tabulares.
   Layout: menu lateral fixo + área de trabalho com cartões-resumo antes do detalhe. */
:root{
  --bg:#f3f4f0; --surface:#ffffff; --surface-2:#eceee7; --ink:#1c211a; --ink-2:#565d52; --line:#d7dacf;
  --accent:#4b5d23; --accent-ink:#ffffff; --accent-soft:#e3e8d3;
  --ok:#2f7a3e; --ok-soft:#dcefdf; --warn:#a46a00; --warn-soft:#f8ecd2; --crit:#b3261e; --crit-soft:#f8dcd9; --info:#2c5d8a; --info-soft:#dbe7f2;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141712; --surface:#1c201a; --surface-2:#252a22; --ink:#e7eadf; --ink-2:#a3ab9b; --line:#343a30;
  --accent:#a9bf6a; --accent-ink:#141712; --accent-soft:#2c3420;
  --ok:#7fc58b; --ok-soft:#1f3323; --warn:#e2b053; --warn-soft:#3a2f17; --crit:#f08a80; --crit-soft:#3d1f1c; --info:#86b4de; --info-soft:#1c2c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141712; --surface:#1c201a; --surface-2:#252a22; --ink:#e7eadf; --ink-2:#a3ab9b; --line:#343a30;
  --accent:#a9bf6a; --accent-ink:#141712; --accent-soft:#2c3420;
  --ok:#7fc58b; --ok-soft:#1f3323; --warn:#e2b053; --warn-soft:#3a2f17; --crit:#f08a80; --crit-soft:#3d1f1c; --info:#86b4de; --info-soft:#1c2c3b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body)}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.brand{font:700 26px/1 var(--display);letter-spacing:.04em;padding:4px 10px 2px}
.brand span{color:var(--accent)}
.brand-sub{font-size:11px;color:var(--ink-2);padding:0 10px 14px;line-height:1.35}
nav.side a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
nav.side a .n{font:500 11px var(--mono);color:var(--ink-2);width:18px}
nav.side a:hover{background:var(--surface-2)}
nav.side a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav.side a.on .n{color:var(--accent)}
main{overflow:auto;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header.top h1{font:600 24px/1.1 var(--display);margin:0;letter-spacing:.02em;flex:1;min-width:200px;text-wrap:balance}
.meta{font-size:12px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.view{padding:20px 24px 48px;display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%}
.scope{background:var(--info-soft);border:1px solid var(--line);border-left:4px solid var(--info);padding:10px 14px;border-radius:6px;font-size:13px}
.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(auto-fill,minmax(178px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card .k{font-size:12px;color:var(--ink-2)}
.card .v{font:600 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.card .s{font-size:11px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font:600 18px/1.2 var(--display);margin:0;letter-spacing:.02em}
.panel h3{font:600 15px/1.2 var(--display);margin:4px 0 0;letter-spacing:.02em;color:var(--ink-2);text-transform:uppercase}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.note{font-size:12px;color:var(--ink-2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:12px;white-space:nowrap;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)}
.p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--surface-2);color:var(--ink-2)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--ink-2)}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:140px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 18px}
.kv div{display:flex;flex-direction:column;border-bottom:1px dashed var(--line);padding-bottom:5px}
.kv div.wide{grid-column:1/-1}
.kv b{font-size:11px;color:var(--ink-2);font-weight:500}
.kv span{font-variant-numeric:tabular-nums;word-break:break-word}
.na{color:var(--ink-2);font-style:italic}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;font:600 15px var(--display);letter-spacing:.03em}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 92px;gap:8px;align-items:center;font-size:12px}
.bar .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar .val{text-align:right;font-variant-numeric:tabular-nums}
.calc{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border-radius:6px;padding:10px 12px;line-height:1.7;white-space:pre-wrap}
.crumb{font-size:12px;color:var(--ink-2)} .crumb a{cursor:pointer}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:560px;padding:18px 20px}
dialog::backdrop{background:rgba(0,0,0,.35)}
.toast{position:fixed;bottom:16px;right:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.pager{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cal div{background:var(--surface-2);border-radius:6px;padding:8px 10px}
.cal b{font:600 16px var(--display)}
@media (max-width:820px){.app{grid-template-columns:1fr}nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.brand-sub{display:none}nav.side a{white-space:nowrap}.view{padding:16px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav" aria-label="Módulos">
    <div class="brand">RADAR <span>OM</span></div>
    <div class="brand-sub">Monitoramento de pregões, atas e adesões das OM do Exército Brasileiro</div>
  </nav>
  <main>
    <header class="top">
      <h1 id="titulo">Dashboard</h1>
      <div class="meta" id="meta"></div>
      <button class="btn pri" id="btnSync" type="button">Atualizar dados agora</button>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<dialog id="dlg"><div id="dlgBody"></div><p><button class="btn" type="button" onclick="document.getElementById('dlg').close()">Fechar</button></p></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
"use strict";
// ---------- carregamento: modo demonstração (sem backend) ou produção (Supabase + login) ----------
const SESS = {get(){try{return JSON.parse(sessionStorage.getItem('radar-om-sessao')||'null')}catch(e){return null}}, set(v){try{sessionStorage.setItem('radar-om-sessao',JSON.stringify(v))}catch(e){}}, clear(){try{sessionStorage.removeItem('radar-om-sessao')}catch(e){}}};
let CFG = {modo:'demonstracao'};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function telaLogin(msg){
  document.getElementById('titulo').textContent='Entrar no RADAR OM';
  document.getElementById('view').innerHTML=`<div class="panel" style="max-width:420px"><h2>Acesso restrito</h2><p class="note">Use o e-mail e a senha cadastrados pelo administrador do RADAR OM.</p>
  <form id="flogin" class="filters" style="flex-direction:column;align-items:stretch">
   <label for="l_email">E-mail<input id="l_email" type="email" autocomplete="username" required></label>
   <label for="l_senha">Senha<input id="l_senha" type="password" autocomplete="current-password" required></label>
   <button class="btn pri" type="submit">Entrar</button><p class="note" id="l_msg" role="alert">${msg||''}</p></form></div>`;
  document.getElementById('flogin').onsubmit=async e=>{e.preventDefault();
    const r=await fetch(`${CFG.supabaseUrl}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'content-type':'application/json'},body:JSON.stringify({email:l_email.value,password:l_senha.value})}).catch(()=>null);
    if(!r||!r.ok){document.getElementById('l_msg').textContent='E-mail ou senha incorretos.';return}
    SESS.set(await r.json()); iniciar();};
}
// leitura direta do Supabase com o token do usuário (RLS aplica o perfil); sem passar pelo Worker
async function renovarSessao(){
  const ses=SESS.get(); if(!ses||!ses.refresh_token) return null;
  const r=await fetch(`${CFG.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,'content-type':'application/json'},body:JSON.stringify({refresh_token:ses.refresh_token})}).catch(()=>null);
  if(!r||!r.ok) return null; const nova=await r.json(); SESS.set(nova); return nova;
}
async function sb(caminho, init={}, tentou=false){
  const ses=SESS.get();
  const r=await fetch(`${CFG.supabaseUrl}/rest/v1/${caminho}`,{...init,headers:{apikey:CFG.supabaseAnonKey,authorization:'Bearer '+(ses&&ses.access_token),'accept-profile':'radar','content-profile':'radar','content-type':'application/json',...(init.headers||{})}});
  if(r.status===401&&!tentou&&await renovarSessao()) return sb(caminho,init,true);
  return r;
}
async function lerView(view){
  const out=[];
  for(let ini=0;;ini+=1000){
    const r=await sb(`${view}?select=*`,{headers:{range:`${ini}-${ini+999}`,'range-unit':'items'}});
    if(r.status===401) throw Object.assign(new Error('sessao'),{sessao:true});
    if(!r.ok) throw Object.assign(new Error(`radar.${view}: HTTP ${r.status} — ${(await r.text()).slice(0,240)}`),{view});
    const lote=await r.json(); out.push(...lote); if(lote.length<1000) return out;
  }
}
async function carregarDados(){
  CFG = await fetch('/api/config').then(r=>r.json()).catch(()=>({modo:'demonstracao'}));
  if(CFG.modo!=='producao') return fetch('demo-snapshot.json').then(r=>r.json()).then(d=>({...d,modo:'demonstracao'}));
  if(!SESS.get()){telaLogin(); return null}
  const pr=await sb('rpc/meu_perfil',{method:'POST',body:'{}'});
  const perfil=pr.ok?await pr.json():null;
  if(!perfil){SESS.clear(); telaLogin('Sessão expirada ou usuário sem perfil ativo no RADAR OM. Entre novamente.'); return null}
  const views=['api_oms','api_uasgs_ext','api_atas','api_itens','api_fornecedores','api_saldos','api_unidades','api_adesoes','api_contratos','api_sync','api_dashboard'].concat(perfil==='ADMINISTRADOR'?['api_fila']:[]);
  const res=await Promise.allSettled(views.map(lerView));
  if(res.some(x=>x.status==='rejected'&&x.reason&&x.reason.sessao)){SESS.clear(); telaLogin('Sessão expirada. Entre novamente.'); return null}
  const falhas=res.map((x,k)=>({view:views[k],ok:x.status==='fulfilled',detalhe:x.status==='rejected'?String(x.reason.message||x.reason):''}));
  if(falhas.some(x=>!x.ok)){
    document.getElementById('view').innerHTML=`<div class="panel"><h2>Não foi possível carregar os dados</h2><p>Uma ou mais consultas ao banco falharam. Se o erro mencionar uma view inexistente, rode supabase/REPARO_VIEWS_E_PERMISSOES.sql no SQL Editor.</p><div class="tw"><table><thead><tr><th>View</th><th>Resultado</th><th>Detalhe</th></tr></thead><tbody>${falhas.map(d=>`<tr><td class="mono">radar.${esc(d.view)}</td><td><span class="pill ${d.ok?'p-ok':'p-crit'}">${d.ok?'OK':'falhou'}</span></td><td class="mono">${esc(d.detalhe)}</td></tr>`).join('')}</tbody></table></div><p><button class="btn" type="button" id="btnSair">Sair</button></p></div>`;
    document.getElementById('btnSair').onclick=()=>{SESS.clear();location.reload()}; return null;
  }
  const [oms,uasgsExt,atas,itens,forn,saldos,unidades,adesoes,contratos,sync,dash,fila]=res.map(x=>x.value);
  return {geradoEm:new Date().toISOString(),modo:'producao',perfil,oms,uasgsExt,atas,itens,saldos,unidades,adesoes,contratos,sync,dash:dash[0]||{},fila:fila||[],
    fornecedores:Object.fromEntries(forn.map(x=>[x.ni,x.razao_social]))};
}
async function iniciar(){ const S0 = await carregarDados(); if(S0) app(S0); }
document.getElementById('view').innerHTML='<p class="note">Carregando dados…</p>';
iniciar();
function app(S){
const HOJE = S.geradoEm.slice(0,10);
// ---------- índices ----------
const omPor = Object.fromEntries(S.oms.map(o=>[o.u,o]));
const extPor = Object.fromEntries((S.uasgsExt||[]).map(o=>[o.u,o]));
const ataPor = {}; S.atas.forEach((a,i)=>{a.i=i; ataPor[a.k]=a});
const itensPorAta = {}; S.itens.forEach(it=>{(itensPorAta[it.k] ||= []).push(it)});
const itemPor = Object.fromEntries(S.itens.map(i=>[i.id,i]));
const saldoPor = Object.fromEntries((S.saldos||[]).map(s=>[s.item_id,s]));
const unidPorItem = {}; (S.unidades||[]).forEach(u=>{(unidPorItem[u.item] ||= []).push(u)});
const AD = (S.adesoes||[]).map((a,i)=>({...a,i}));
const ctrPorAta = {}; (S.contratos||[]).forEach(c=>{ if(c.ata)(ctrPorAta[c.ata] ||= []).push(c)});
const forn = S.fornecedores||{};
// ---------- utilidades ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl = v => v==null ? '<span class="na">não disponível</span>' : Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlC = v => v==null ? '—' : (Math.abs(v)>=1e6 ? 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi' : Math.abs(v)>=1e3 ? 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil' : brl(v));
const num = v => v==null ? '<span class="na">não disponível</span>' : Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2});
const dt = v => v ? v.slice(0,10).split('-').reverse().join('/') : '<span class="na">não disponível</span>';
const NA = '<span class="na">não disponível na fonte</span>';
const nomeU = u => omPor[u]?.n || extPor[u]?.n || u;
const ehEB = u => !!omPor[u];
const SIT = {VIGENTE:['Ata vigente','p-ok'],PROXIMA_DO_VENCIMENTO:['Próxima do vencimento','p-warn'],VENCIDA:['Ata vencida','p-mute'],CANCELADA:['Ata cancelada','p-crit'],EXCLUIDA_NA_FONTE:['Excluída na fonte','p-crit'],A_INICIAR:['A iniciar','p-info'],SEM_VIGENCIA_INFORMADA:['Sem vigência','p-mute']};
const sitPill = s => `<span class="pill ${SIT[s]?.[1]||'p-mute'}">${SIT[s]?.[0]||esc(s)}</span>`;
const SAL = {CONFERE_COM_A_FONTE:['Confere com a fonte','p-ok'],DIVERGENTE_DA_FONTE:['Divergente da fonte','p-crit'],NAO_ACEITA_ADESAO:['Não aceita adesão','p-mute']};
const toast = m => {const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600)};
const omLink = u => `<a href="#om-${esc(u)}">${esc(nomeU(u))}</a> <span class="mono">${esc(u)}</span>${ehEB(u)?'':' <span class="pill p-info">fora do Exército</span>'}`;
function bars(rows, fmt=v=>v.toLocaleString('pt-BR')){
  if(!rows.length) return '<p class="note">Sem registros na base atual.</p>';
  const max = Math.max(...rows.map(r=>r[1]))||1;
  return '<div class="bars">'+rows.map(([l,v])=>`<div class="bar"><span class="l" title="${esc(l)}">${esc(l)}</span><span class="t"><i style="width:${Math.max(2,100*v/max)}%"></i></span><span class="val">${fmt(v)}</span></div>`).join('')+'</div>';
}
function agrupa(lista, chave, val=()=>1){const m={}; lista.forEach(x=>{const k=chave(x); m[k]=(m[k]||0)+val(x)}); return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function tabela(cols, rows, {click, id, pag=25}={}){
  const tid = id||('t'+Math.random().toString(36).slice(2,8));
  const st = {p:0};
  const render = () => {
    const el = document.getElementById(tid); if(!el) return;
    const tot = rows.length, pags = Math.max(1,Math.ceil(tot/pag)); st.p=Math.min(st.p,pags-1);
    const fatia = rows.slice(st.p*pag, st.p*pag+pag);
    el.innerHTML = `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'num':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${
      fatia.length? fatia.map((r,i)=>`<tr ${click?`class="click" data-i="${st.p*pag+i}" tabindex="0"`:''}>${cols.map(c=>`<td class="${c.n?'num':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${cols.length}" class="note">Nenhum registro encontrado com estes filtros.</td></tr>`}</tbody></table></div>
      <div class="pager"><span>${tot.toLocaleString('pt-BR')} registro(s)</span>${pags>1?`<button class="btn" type="button" data-p="-1">Anterior</button><span>página ${st.p+1} de ${pags}</span><button class="btn" type="button" data-p="1">Próxima</button>`:''}
      <button class="btn" type="button" data-csv="1">Copiar CSV</button></div>`;
    el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.p+=+b.dataset.p; if(st.p<0)st.p=0; render()});
    el.querySelector('[data-csv]').onclick=()=>copiarCSV(cols,rows);
    if(click) el.querySelectorAll('tr.click').forEach(tr=>{const go=()=>click(rows[+tr.dataset.i]); tr.onclick=go; tr.onkeydown=e=>{if(e.key==='Enter')go()}});
  };
  setTimeout(render);
  return `<div id="${tid}"></div>`;
}
function copiarCSV(cols, rows){
  const txt = s => String(s).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').trim();
  const linhas = [cols.map(c=>txt(c.h)), ...rows.map(r=>cols.map(c=>txt(c.csv? c.csv(r) : c.f(r))))];
  const csv = linhas.map(l=>l.map(v=>/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v).join(';')).join('\n');

      &&(!f.sit||a.sit===f.sit)&&(!f.dias||(a.dias>=0&&a.dias<=+f.dias))&&(!f.vmin||(+i.vt||0)>=+f.vmin)&&(!f.ger||a.ger===f.ger)});
  const cols=[{h:'Gerenciadora',f:i=>esc(nomeU(ataPor[i.k].ger))},{h:'Ata',f:i=>esc(ataPor[i.k].num)},{h:'Item',f:i=>esc(i.n)},{h:'Descrição',f:i=>esc((i.d||'').slice(0,90))},{h:'Grupo',f:i=>esc(i.g)},{h:'Categoria',f:i=>esc(i.c||'—')},{h:'Fornecedor',f:i=>esc(forn[i.f]||i.f)},{h:'Qtd.',n:1,f:i=>num(i.qr)},{h:'Valor total',n:1,f:i=>brl(i.vt)},{h:'Vence',f:i=>dt(ataPor[i.k].vf)},{h:'Situação',f:i=>sitPill(ataPor[i.k].sit)}];

  return `<div class="panel"><h2>Pesquisa avançada de itens</h2><p class="note">Combine filtros livremente. Exemplos: grupo MANUTENÇÃO + vence em 30 dias; categoria Pneus e acessórios + situação vigente; valor mínimo 100000.</p>

   <label for="p_grp">Tipo de despesa<select id="p_grp"><option value="">Todos</option><option value="AQUISICAO">Aquisição</option><option value="MANUTENCAO">Manutenção</option><option value="SERVICOS">Serviços</option><option value="OUTROS">Outros</option></select></label>
   <label for="p_cat">Categoria<select id="p_cat"><option value="">Todas</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>
   <label for="p_forn">Fornecedor (nome ou CNPJ)<input id="p_forn"></label>
   <label for="p_sit">Situação da ata<select id="p_sit"><option value="">Todas</option>${Object.entries(SIT).map(([k,[l]])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
   <label for="p_dias">Vence em até (dias)<input id="p_dias" type="number" min="0" placeholder="30"></label>
   <label for="p_vmin">Valor total mínimo (R$)<input id="p_vmin" type="number" min="0" placeholder="100000"></label>
   <label for="p_ger">Gerenciadora<select id="p_ger"><option value="">Todas</option>${[...new Set(S.atas.map(a=>a.ger))].map(g=>`<option value="${g}">${esc(nomeU(g))}</option>`).join('')}</select></label></div>
  <div id="pt">${tabela(cols,lista(),{click:i=>location.hash='ata-'+ataPor[i.k].i})}</div>
  <p class="note">Exportação: "Copiar CSV" copia o resultado completo do filtro (separador ponto e vírgula) para colar no Excel. A exportação direta para .xlsx e PDF é feita pelo backend na versão implantada; esta página publicada não pode iniciar downloads.</p></div>`;
};

a cada minuto  o Worker processa até 23 tarefas (1 consulta à API + 1 gravação via radar.ingerir no banco)

// ---------- roteamento por hash ----------
function rotear(){
  const h = (location.hash||'#dashboard').slice(1);
  let html, tit, mod=h;
  if(h.startsWith('om-')){html=fichaOM(h.slice(3)); tit='Ficha da OM'; mod='oms'}
  else if(h.startsWith('ata-')){html=fichaAta(+h.slice(4)); tit='Ficha da ata'; mod='atas'}
  else if(h.startsWith('adesao-')){html=fichaAdesao(+h.slice(7)); tit='Ficha da adesão'; mod='adesoes'}
  else if(h.startsWith('saldo-')){html=fichaSaldo(+h.slice(6)); tit='Saldo do item'; mod='saldos'}
  else {const m=MODULOS.find(x=>x[0]===h)||MODULOS[0]; mod=m[0]; tit=m[1]; html=V[mod]()}
  document.getElementById('titulo').textContent=tit;
  document.getElementById('view').innerHTML=html;
  document.querySelectorAll('nav.side a').forEach(a=>a.classList.toggle('on',a.dataset.h===mod));
  document.querySelector('main').scrollTop=0;
}
addEventListener('hashchange',rotear); rotear();
}
